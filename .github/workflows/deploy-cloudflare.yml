name: Deploy ke Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nilai VITE_* dibaca dari .env (URL + publishable key Supabase, aman untuk publik)
      - name: Build
        run: npm run build

      - name: Validasi konfigurasi Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Lewati deploy (secret Cloudflare belum di-set)
        if: env.CLOUDFLARE_API_TOKEN == '' && github.event_name != 'pull_request'
        run: echo "::warning::Set secret CLOUDFLARE_API_TOKEN & CLOUDFLARE_ACCOUNT_ID di GitHub untuk mengaktifkan deploy otomatis."

      - name: Deploy ke Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request'
        run: npx wrangler deploy

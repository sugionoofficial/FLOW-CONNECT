name: Desktop (Windows)

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Uji (${{ matrix.os }}, Chrome asli)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CHROME_ARGS: ${{ matrix.os == 'ubuntu-latest' && '--headless=new --no-sandbox' || '--headless=new' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Uji integrasi (mesin CDP + tampilan)
        run: |
          set -o pipefail
          node --test --test-reporter=spec --test-force-exit --test-timeout=600000 test/*.test.js 2>&1 | tee test.log
      - name: Uji Alat Kreatif (12 alat offline, dijalankan tersendiri agar tidak berebut CPU)
        if: always()
        run: |
          set -o pipefail
          node --test --test-reporter=spec --test-force-exit --test-timeout=600000 test/lab.e2e.js 2>&1 | tee lab.log
      - name: Ringkasan uji
        if: always()
        run: |
          node scripts/test-annotate.js test.log
          node scripts/test-annotate.js lab.log
      - name: Uji kartu login dengan Chrome berjendela (navigator.webdriver harus false)
        if: matrix.os == 'windows-latest'
        env:
          CHROME_HEADED_ARGS: '--disable-gpu'
        run: node --test --test-reporter=spec --test-force-exit --test-name-pattern="Chrome asli berjendela" test/flow.test.js

  build-win:
    name: Build installer Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build .exe (installer + portable)
        run: npx electron-builder --win --publish never
      - name: Uji asap — jalankan aplikasi hasil build
        run: '"dist/win-unpacked/FLOW CONNECT Desktop.exe" --smoke-test'
      - name: Periksa berkas pembaruan otomatis
        run: |
          ls -la dist
          test -f dist/latest.yml && test -f dist/FLOW-CONNECT-Desktop-Setup.exe.blockmap
          test -f "dist/win-unpacked/resources/app-update.yml"
          cat dist/latest.yml
          grep -q "version: $(node -p "require('./package.json').version")" dist/latest.yml
      - name: Versi
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FLOW-CONNECT-Desktop-${{ steps.v.outputs.version }}-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
      - name: Terbitkan rilis
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FLOW CONNECT Desktop v${{ steps.v.outputs.version }}
          make_latest: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          body: |
            Aplikasi PC untuk mengendalikan Google Flow (akun Google Anda sendiri) dari satu aplikasi.

            **Unduh:**
            - `FLOW-CONNECT-Desktop-Setup.exe` — installer (disarankan)
            - `FLOW-CONNECT-Desktop-Portable.exe` — tanpa instal

            **Baru di versi ini (v1.9.0):** alat baru **Upscale Gambar**, **Cek Metadata** dan **Gabung Video**, skill **Character Sheet Pro**, serta perbaikan **Bulk**. Bulk sekarang selalu memakai generate biasa: foto referensi hanya dipakai sebagai bahan (@), tidak pernah mengedit foto yang diunggah. Kalau Google Flow membuka tampilan edit gambar, menyalakan Flow Agent, atau ada kartu yang terpilih, aplikasi kembali ke grid project dulu. Hasil editan yang menumpuk sebagai versi tidak dihitung. Akun yang gagal berturut-turut dipulihkan dengan project baru yang bersih, sehingga semua akun ikut bekerja. Tugas yang gagal di satu akun diulang oleh akun lain, dan alasan gagal tiap akun tampil di tabel akun. Dari v1.8.0: Alat Kreatif (alat offline pengganti alat Google Flow).

            Butuh Google Chrome atau Microsoft Edge di PC. Windows mungkin menampilkan "Windows melindungi PC Anda" karena aplikasi belum ditandatangani: klik **Info selengkapnya → Tetap jalankan**.

            Tidak berafiliasi dengan Google.

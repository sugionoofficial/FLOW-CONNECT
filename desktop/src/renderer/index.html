<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: file: blob:; media-src 'self' file: data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="color-scheme" content="light dark" />
  <title>FLOW CONNECT Desktop</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="titlebar" class="titlebar">
    <img src="icon.png" alt="" width="18" height="18" />

    <span id="tb-status" class="tb-status"></span>

  <div class="app">
    <nav class="nav" aria-label="Navigasi utama">
      <div class="nav-brand">
        <img src="icon.png" alt="" width="28" height="28" />
        <div><div class="nb-name">FLOW CONNECT</div><div class="nb-sub">Studio untuk Google Flow</div></div>
      </div>
      <div id="nav-items" class="nav-items"></div>
      <div id="nav-account" class="nav-account"></div>
      <div id="nav-bottom" class="nav-items nav-bottom"></div>
    </nav>
    <main id="page" class="page" tabindex="-1"></main>
    <footer id="statusbar" class="statusbar"></footer>
  </div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
